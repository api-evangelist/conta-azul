  /v1/financeiro/eventos-financeiros/contas-a-pagar/buscar:
    get:
      summary: Retornar as despesas por filtro
      operationId: searchInstallmentsToPayByFilter
      description: Permite consultar as parcelas de despesas (contas a pagar) conforme filtros como data de vencimento, data competência, data de alteração, valor, status, conta financeira, etc. Essa consulta possibilita monitorar as obrigações financeiras pendentes ou pagas, favorecendo a gestão e o planejamento.
      tags:
      - Financeiro
      parameters:
      - name: pagina
        in: query
        description: Página
        example: 1
        required: true
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: tamanho_pagina
        in: query
        description: Tamanho da página
        example: 10
        required: true
        schema:
          enum:
          - 10
          - 20
          - 50
          - 100
          - 200
          - 500
          - 1000
          type: integer
          minimum: 1
      - name: campo_ordenado_ascendente
        in: query
        required: false
        description: Campo para ordenação ascendente. Se informado ele desconsidera o valor do campo_ordenado_descendente. É possível ordenar por id do centro de custo (id),  pelo código (CODIGO), pelo nome (NOME) e por ativo (ATIVO)
        example: nome
        schema:
          type: string
          enum:
          - ID
          - CODIGO
          - NOME
          - ATIVO
      - name: campo_ordenado_descendente
        in: query
        required: false
        description: Campo para ordenação descendente. Se este campo for utilizado, o campo campo_ordenado_ascendente não  deverá ser informado. É possível ordenar por id do centro de custo (id), pelo código (CODIGO), pelo  nome (NOME) ou por ativo (ATIVO)
        example: nome
        schema:
          type: string
          enum:
          - ID
          - CODIGO
          - NOME
          - ATIVO
      - name: descricao
        in: query
        description: Descrição da conta
        example: Pagamento do salário
        required: false
        schema:
          type: string
      - name: data_vencimento_de
        in: query
        description: Date de vencimento de (ISO date format)
        example: '2027-08-15'
        required: true
        schema:
          type: string
          format: date
      - name: data_vencimento_ate
        in: query
        description: Data de vencimento até (ISO date format)
        example: '2027-08-20'
        required: true
        schema:
          type: string
          format: date
      - name: data_competencia_de
        in: query
        description: Data de competência de (ISO date format)
        example: '2025-08-15'
        required: false
        schema:
          type: string
          format: date
      - name: data_competencia_ate
        in: query
        description: Data de competência até (ISO date format)
        example: '2025-08-20'
        required: false
        schema:
          type: string
          format: date
      - name: data_pagamento_de
        in: query
        description: Data de pagamento de (ISO date format)
        example: '2025-08-15'
        required: false
        schema:
          type: string
          format: date
      - name: data_pagamento_ate
        in: query
        description: Data de pagamento até (ISO date format)
        example: '2025-08-20'
        required: false
        schema:
          type: string
          format: date
      - name: data_alteracao_de
        in: query
        description: Data de alteração de (ISO 8601, São Paulo/GMT-3)
        example: '2025-10-20T07:00:00'
        required: false
        schema:
          type: string
          format: date-time
      - name: data_alteracao_ate
        in: query
        description: Data de alteração até (ISO 8601, São Paulo/GMT-3)
        example: '2025-10-20T07:59:59'
        required: false
        schema:
          type: string
          format: date-time
      - name: valor_de
        in: query
        description: Valor de
        example: '100'
        required: false
        schema:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
          example: '110.10'
      - name: valor_ate
        in: query
        description: Valor até
        example: '500'
        required: false
        schema:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
          example: '110.10'
      - name: status
        in: query
        description: Lista de status da conta
        example: ATRASADO
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - PERDIDO
            - RECEBIDO
            - EM_ABERTO
            - RENEGOCIADO
            - RECEBIDO_PARCIAL
            - ATRASADO
      - name: ids_contas_financeiras
        in: query
        description: Lista de IDs de contas financeiras
        example: 35473eec-4e74-11ee-b500-9f61de8a8b8b
        required: false
        schema:
          type: array
          items:
            type: string
      - name: ids_categorias
        in: query
        description: Lista de IDs de categorias
        example: 35473eec-4e74-11ee-b500-9f61de8a8b8b
        required: false
        schema:
          type: array
          items:
            type: string
      - name: ids_centros_de_custo
        in: query
        description: Lista de IDs de centros de custo
        example: 35473eec-4e74-11ee-b500-9f61de8a8b8b
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens_totais:
                    type: integer
                    example: 6
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContaAPagar'
                  totais:
                    type: object
                    properties:
                      ativo:
                        type: integer
                        example: 6
                      inativo:
                        type: integer
                        example: 0
                      todos:
                        type: integer
                        example: 6
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
    servers:
    - url: https://api-v2.contaazul.com
      description: Servidor de produção
  /v1/financeiro/eventos-financeiros/parcelas/{id}:
    summary: Endpoint de busca de parcelas por id
    get:
      summary: Retornar a parcela por id
      operationId: getInstallmentById
      description: Permite consultar os detalhes de uma parcela específica (de conta a receber ou a pagar) identificada pelo seu id. A resposta traz campos como data de vencimento, valor, status, conta financeira, entre outros.
