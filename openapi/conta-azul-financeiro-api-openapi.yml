      operationId: updateInstallment
      description: Permite atualizar parcialmente uma parcela existente identificada pelo id, alterando campos como data de vencimento, valor, observações, conta financeira e outros campos permitidos. Essa operação ajuda a ajustar lançamentos financeiros sem a necessidade de recriá-los.
      tags:
      - Financeiro
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
          example: 9986f173-f531-4660-96ae-04b71c879264
      requestBody:
        description: Campos aceitos para atualização da parcela
