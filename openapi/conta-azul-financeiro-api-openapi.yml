  /v1/financeiro/eventos-financeiros/alteracoes:
    summary: Endpoint de busca de IDs dos eventos financeiros alterados
    get:
      summary: Retornar os IDs dos eventos financeiros alterados em um período
      operationId: getAlteredFinancialEvents
      description: 'Permite consultar os IDs dos eventos financeiros (contas a pagar e a receber) que foram alterados em um período definido por data de ínico e fim. Essa funcionalidade é útil para identificar quais eventos sofreram modificações recentes, facilitando a sincronização e o monitoramento de mudanças nos dados financeiros. Importante: As informações disponíveis indicam a data e hora em que o evento foi salvo, sem detalhar quais campos foram modificados em cada operação. Salvar um recurso sem alterações reais pode gerar uma entrada no histórico e atualizar a data do último registro.'
      tags:
      - Financeiro
      parameters:
      - name: pagina
        in: query
        description: Página
        required: false
        example: 1
        schema:
          type: integer
          default: 1
      - name: tamanho_pagina
        in: query
        description: Tamanho da página
        required: false
        example: 10
        schema:
          type: integer
          default: 10
      - name: data_inicio
        in: query
        description: Data inicial do período para filtrar os eventos financeiros alterados (ISO 8601, São Paulo/GMT-3)
        example: '2026-01-01T23:59:59'
        required: true
        schema:
          type: string
          format: date-time
      - name: data_fim
        in: query
        description: Data final do período para filtrar os eventos financeiros alterados (ISO 8601, São Paulo/GMT-3)
        example: '2026-03-12T23:59:59'
        required: true
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  itens_totais:
                    type: integer
                    example: 1
                  itens:
                    type: array
                    items:
                      $ref: '#/components/schemas/EventoFinanceiro'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
    servers:
    - url: https://api-v2.contaazul.com
      description: Servidor de produção
