openapi: 3.2.0
info:
  title: Conta Azul Financeiro API
  version: v1
  description: 'Operations tagged Financeiro across 3 of this provider''s published API definitions: conta-azul-acquittance-openapi.yml, conta-azul-charge-openapi.yml, conta-azul-financial-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-v2.contaazul.com
  description: Servidor de produção
security:
- BearerAuth: []
tags:
- name: Financeiro
paths:
  /v1/financeiro/eventos-financeiros/parcelas/{parcela_id}/baixa:
    post:
      summary: Criar uma nova baixa
      operationId: criarBaixa
      description: Permite registrar uma nova baixa vinculada a uma parcela específica. Por meio desse endpoint, é possível informar os dados do pagamento, como data, valor, juros, multa, descontos e método de pagamento. Ao registrar a baixa, o sistema atualiza automaticamente o status da parcela refletindo a quitação realizada.
      tags:
      - Financeiro
      parameters:
      - name: parcela_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 35473eec-4e74-11ee-b500-9f61de8a8b8b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaixaCriacaoRequestDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaixaCriacaoResponseDTO'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
    get:
      summary: Retornar as baixas pelo id da parcela
      operationId: listarBaixas
      description: Permite consultar todas as baixas associadas a uma determinada parcela. Essa funcionalidade possibilita o acompanhamento detalhado de pagamentos realizados, facilitando a auditoria e o controle financeiro.
      tags:
      - Financeiro
      parameters:
      - name: parcela_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 35473eec-4e74-11ee-b500-9f61de8a8b8b
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BaixaResponseDTO'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
    servers:
    - url: https://api-v2.contaazul.com
      description: Servidor de produção
  /v1/financeiro/eventos-financeiros/parcelas/baixa/{baixa_id}:
    patch:
      summary: Atualizar parcialmente uma baixa por id
      operationId: atualizarBaixa
      description: Permite atualizar parcialmente as informações de uma baixa. Use a baixa parcial quando houver pagamento ou recebimento parcial de uma fatura, seja por negociação com cliente/fornecedor ou em situações de inadimplência parcial. Por meio desse endpoint, é possível corrigir dados como valor, conta financeira, data de pagamento ou observações, mantendo o controle de versão para evitar conflitos de atualização.
      tags:
      - Financeiro
      parameters:
      - name: baixa_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 35473eec-4e74-11ee-b500-9f61de8a8b8b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BaixaAtualizacaoRequestDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaixaCriacaoResponseDTO'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
    delete:
      summary: Deletar baixa por id
      operationId: deletarBaixa
      description: Permite excluir uma baixa existente do sistema. Esse endpoint deve ser utilizado com cautela, pois a exclusão impacta diretamente o saldo e o histórico financeiro da parcela associada.
      tags:
      - Financeiro
      parameters:
      - name: baixa_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 35473eec-4e74-11ee-b500-9f61de8a8b8b
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
    get:
      summary: Retornar a baixa por id
      operationId: buscarBaixa
      description: Permite consultar os detalhes de uma baixa específica a partir do seu identificador único (baixa_id). O retorno inclui informações completas sobre a baixa, como data de pagamento, valores envolvidos, conta financeira utilizada, método de pagamento e observações registradas.
      tags:
      - Financeiro
      parameters:
      - name: baixa_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        example: 35473eec-4e74-11ee-b500-9f61de8a8b8b
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaixaResponseDTO'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
    servers:
    - url: https://api-v2.contaazul.com
      description: Servidor de produção
  /v1/financeiro/eventos-financeiros/contas-a-receber/cobranca/{id_cobranca}:
    get:
      summary: Retornar a cobrança por id
      operationId: buscarCobrancaPorId
      description: Permite consultar os detalhes de uma cobrança específica utilizando seu identificador único (id_cobranca).
      tags:
      - Financeiro
      parameters:
      - name: id_cobranca
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Identificador único da cobrança
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GerarCobrancaResponseDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
    delete:
      summary: Deletar cobrança por id
      operationId: deletarCobrancaPorId
      description: Permite cancelar uma cobrança existente identificada por id_cobranca. É recomendada apenas quando a cobrança foi gerada incorretamente ou precisa ser invalidada antes de seu pagamento.
      tags:
      - Financeiro
      parameters:
      - name: id_cobranca
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Identificador único da cobrança
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
    servers:
    - url: https://api-v2.contaazul.com
      description: Servidor de produção
  /v1/financeiro/eventos-financeiros/contas-a-receber/gerar-cobranca:
    post:
      summary: Criar uma nova cobrança
      operationId: criarCobranca
      description: Permite criar uma nova cobrança, por meio desse endpoint, é possível informar o valor, data de vencimento, descrição da fatura e demais parâmetros que definem a cobrança. Essa funcionalidade facilita a geração automatizada de cobranças.
      tags:
      - Financeiro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GerarCobrancaRequestDto'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GerarCobrancaResponseDto'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
    servers:
    - url: https://api-v2.contaazul.com
      description: Servidor de produção
  /v1/financeiro/eventos-financeiros/{id_evento}/parcelas:
    summary: Endpoint de parcelas por evento financeiro
    get:
      summary: Retornar as parcelas pelo id do evento financeiro
      operationId: getInstallmentsByEventId
      description: Permite listar as parcelas vinculadas a um evento financeiro específico (id_evento). Útil para acompanhar cada parcela de um lançamento de contas a pagar ou receber, com seus valores, vencimentos e status e outras informações pertinentes.
      tags:
      - Financeiro
      parameters:
      - name: id_evento
        in: path
        description: uuid ou id legado do evento
        example: 35473eec-4e74-11ee-b500-9f61de8a8b8b
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Parcela'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
    servers:
    - url: https://api-v2.contaazul.com
      description: Servidor de produção
  /v1/financeiro/categorias-dre:
    get:
      summary: Retornar as categorias DRE
      operationId: searchDreCategories
      description: Permite listar as categorias de DRE (Demonstração do Resultado do Exercício) usadas para a estrutura contábil-financeira da empresa, facilitando o fechamento financeiro e contábil.
      tags:
      - Financeiro
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstruturaDRE'
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
    servers:
    - url: https://api-v2.contaazul.com
      description: Servidor de produção
  /v1/financeiro/transferencias:
    summary: Endpoint de Transferências entre Contas Financeiras
    get:
      summary: Retornar as transferências entre contas financeiras por filtro
      operationId: searchAccountingExportTransfers
      tags:
      - Financeiro
      description: Permite consultar as transferências realizadas entre contas financeiras mediante filtros como período de datas e contas financeiras específicas. Para viabilizar a conciliação financeira automática e sincronizar corretamente as movimentações no meu sistema.
      parameters:
      - name: pagina
        in: query
        description: Número da página para paginação dos resultados
        example: 1
        required: false
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: tamanho_pagina
        in: query
        description: Quantidade de itens por página
        example: 10
        required: false
        schema:
          type: integer
          default: 10
          enum:
          - 10
          - 20
          - 50
          - 100
          - 200
          - 500
          - 1000
      - name: ids_conta_financeira
        in: query
        description: Lista de identificadores (UUIDs) das contas financeiras para filtrar as transferências. Retorna transferências onde as contas especificadas sejam origem ou destino.
        example:
        - 35473eec-4e74-11ee-b500-9f61de8a8b8b
        - 8f2a3e45-1c9d-4b3a-a7f1-9e8d7c6b5a4f
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: data_inicio
        in: query
        description: Data inicial do período para filtrar as transferências (formato ISO date)
        example: '2026-01-01'
        required: false
        schema:
          type: string
          format: date
      - name: data_fim
        in: query
        description: Data final do período para filtrar as transferências (formato ISO date)
        example: '2026-12-31'
        required: false
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK - Retorna a lista paginada de transferências entre contas financeiras
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferenciaContaFinanceiraResponse'
              examples:
                exemplo_sucesso:
                  summary: Exemplo de resposta com transferências
                  value:
                    itens_totais: 2
                    itens:
                    - id: 35473eec-4e74-11ee-b500-9f61de8a8b8b
                      descricao: Transferência para conta poupança
                      valor: 1500.5
                      data: '2026-02-15'
                      origem:
                        data: '2026-02-15'
                        composicao_valor:
                          valor_bruto: 1500.5
                          juros: 0
                          multa: 0
                          valor_liquido: 1500.5
                          desconto: 0
                          taxa: 0
                        conta_financeira:
                          id: 8f2a3e45-1c9d-4b3a-a7f1-9e8d7c6b5a4f
                          nome: Conta Corrente Principal
                          instituicao_bancaria:
                            codigo: 1
                            nome: Banco do Brasil
                      destino:
                        data: '2026-02-15'
                        composicao_valor:
                          valor_bruto: 1500.5
                          juros: 0
                          multa: 0
                          valor_liquido: 1500.5
                          desconto: 0
                          taxa: 0
                        conta_financeira:
                          id: 7d1b2c34-8a5e-4f6d-b9c2-3e4f5a6b7c8d
                          nome: Conta Poupança
                          instituicao_bancaria:
                            codigo: 1
                            nome: Banco do Brasil
                    - id: 9a8b7c6d-5e4f-3a2b-1c0d-9e8f7a6b5c4d
                      descricao: Transferência para investimento
                      valor: 5000
                      data: '2026-02-20'
                      origem:
                        data: '2026-02-20'
                        composicao_valor:
                          valor_bruto: 5000
                          juros: 0
                          multa: 0
                          valor_liquido: 5000
                          desconto: 0
                          taxa: 0
                        conta_financeira:
                          id: 8f2a3e45-1c9d-4b3a-a7f1-9e8d7c6b5a4f
                          nome: Conta Corrente Principal
                          instituicao_bancaria:
                            codigo: 341
                            nome: Itaú
                      destino:
                        data: '2026-02-20'
                        composicao_valor:
                          valor_bruto: 5000
                          juros: 0
                          multa: 0
                          valor_liquido: 5000
                          desconto: 0
                          taxa: 0
                        conta_financeira:
                          id: 6c5d4e3f-2a1b-9c8d-7e6f-5a4b3c2d1e0f
                          nome: Conta Investimento
                          instituicao_bancaria:
                            codigo: 341
                            nome: Itaú
                exemplo_vazio:
                  summary: Exemplo de resposta sem transferências
                  value:
                    itens_totais: 0
                    itens: []
        '400':
          description: Bad Request - Parâmetros inválidos na requisição
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: A data de início não pode ser posterior à data de fim.
              examples:
                data_invalida:
                  summary: Erro de validação de datas
                  value:
                    code: 400
                    message: A data de início não pode ser posterior à data de fim.
                uuid_invalido:
                  summary: Erro de UUID inválido
                  value:
                    code: 400
                    message: O valor fornecido no parâmetro 'ids_conta_financeira' não é um identificador (uuid) válido.
        '401':
          description: Unauthorized - Token de autenticação inválido ou expirado
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: The Token has expired.
              example:
                code: 401
                message: The Token has expired.
        '429':
          description: Too Many Requests - Limite de requisições excedido
        '500':
          description: Internal Server Error - Erro interno no servidor
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: Ocorreu um erro inesperado no servidor. Tente novamente mais tarde.
              example:
                code: 500
                message: Ocorreu um erro inesperado no servidor. Tente novamente mais tarde.
    servers:
    - url: https://api-v2.contaazul.com
      description: Servidor de produção
  /v1/financeiro/eventos-financeiros/contas-a-receber:
    post:
      summary: Criar um novo evento financeiro de contas a receber
      operationId: createReceivableFinancialEvent
      description: Permite criar um novo evento financeiro de contas a receber, passando dados como data de competência, valor, descrição, conta financeira, condições de pagamento, entre outros. Facilita o registro de receitas previstas ou realizadas.
      tags:
      - Financeiro
      requestBody:
        description: Dados do evento financeiro de contas a receber
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoFinanceiroRequest'
      responses:
        '202':
          description: Evento financeiro de contas a receber criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtocolResponseDTO'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
    servers:
    - url: https://api-v2.contaazul.com
      description: Servidor de produção
  /v1/financeiro/eventos-financeiros/contas-a-receber/buscar:
    summary: Endpoint de Contas a Receber
    get:
      summary: Retornar as receitas por filtro
      operationId: searchInstallmentsToReceiveByFilter
      description: Permite consultar as parcelas de receitas (contas a receber) mediante filtros como data de vencimento, data de competência, data de pagamento, data de alteração, valor, status, dentre outros. Essa funcionalidade ajuda no controle e análise de entradas financeiras com base nas condições definidas.
      tags:
      - Financeiro
      parameters:
      - name: pagina
        in: query
        description: Página
        example: 1
        required: true
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: tamanho_pagina
        in: query
        description: Tamanho da página
        example: 10
        schema:
          enum:
          - 10
          - 20
          - 50
          - 100
          - 200
          - 500
          - 1000
          type: integer
          minimum: 1
        required: true
      - name: campo_ordenado_ascendente
        in: query
        description: Campo para ordenação ascendente. Se informado ele desconsidera o valor do campo_ordenado_descendente. É possível ordenar por nome
        required: false
        example: nome
        schema:
          type: string
      - name: campo_ordenado_descendente
        in: query
        description: Campo para ordenação descendente. Se este campo for utilizado, o campo campo_ordenado_ascendente não deverá ser informado. É possível ordenar por nome
        example: nome
        required: false
        schema:
          type: string
      - name: descricao
        in: query
        description: Descrição da conta
        example: Conta Corrente
        required: false
        schema:
          type: string
      - name: data_vencimento_de
        in: query
        description: Data de vencimento de (ISO date format)
        example: '2027-08-15'
        required: true
        schema:
          type: string
          format: date
      - name: data_vencimento_ate
        in: query
        description: Data de vencimento até (ISO date format)
        example: '2027-08-20'
        required: true
        schema:
          type: string
          format: date
      - name: data_competencia_de
        in: query
        description: Data de competência de (ISO date format)
        example: '2025-08-15'
        required: false
        schema:
          type: string
          format: date
      - name: data_competencia_ate
        in: query
        description: Data de competência até (ISO date format)
        example: '2025-08-20'
        required: false
        schema:
          type: string
          format: date
      - name: data_pagamento_de
        in: query
        description: Data de pagamento de (ISO date format)
        example: '2025-08-15'
        required: false
        schema:
          type: string
          format: date
      - name: data_pagamento_ate
        in: query
        description: Data de pagamento até (ISO date format)
        example: '2025-08-20'
        required: false
        schema:
          type: string
          format: date
      - name: data_alteracao_de
        in: query
        description: Data de alteração de (ISO 8601, São Paulo/GMT-3)
        example: '2025-10-20T07:00:00'
        required: false
        schema:
          type: string
          format: date-time
      - name: data_alteracao_ate
        in: query
        description: Data de alteração até (ISO 8601, São Paulo/GMT-3)
        example: '2025-10-20T07:59:59'
        required: false
        schema:
          type: string
          format: date-time
      - name: valor_de
        in: query
        description: Valor de
        example: '100'
        required: false
        schema:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
          example: '999.99'
      - name: valor_ate
        in: query
        description: Valor até
        example: '500'
        required: false
        schema:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
          example: '999.99'
      - name: status
        in: query
        description: Status da conta
        example: ATRASADO
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - PERDIDO
            - RECEBIDO
            - EM_ABERTO
            - RENEGOCIADO
            - RECEBIDO_PARCIAL
            - ATRASADO
      - name: ids_contas_financeiras
        in: query
        description: Lista de IDs de contas financeiras
        required: false
        schema:
          type: array
          items:
            type: string
      - name: ids_categorias
        in: query
        description: Lista de IDs de categorias
        required: false
        schema:
          type: array
          items:
            type: string
      - name: ids_centros_de_custo
        in: query
        description: Lista de IDs de centros de custo
        required: false
        schema:
          type: array
          items:
            type: string
      - name: ids_clientes
        in: query
        description: Lista de IDs de clientes
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContasAReceberResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
    servers:
    - url: https://api-v2.contaazul.com
      description: Servidor de produção
  /v1/financeiro/eventos-financeiros/contas-a-pagar:
    post:
      summary: Criar um novo evento financeiro de contas a pagar
      operationId: createPayableFinancialEvent
      description: Permite criar um novo evento financeiro de contas a pagar, informando dados como valor, condições de pagamento, descrição, conta financeira, entre outros. Esse endpoint facilita o registro das obrigações financeiras da empresa.
      tags:
      - Financeiro
      requestBody:
