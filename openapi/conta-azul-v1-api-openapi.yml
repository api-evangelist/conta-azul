      - name: ids_categorias
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: ids das categorias
      - name: ids_produtos
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
        description: ids dos produtos
      - name: pendente
        in: query
        required: false
        schema:
          type: boolean
        description: Indica se a venda está pendente
      - name: totais
        in: query
        required: false
        schema:
          type: string
        description: Tipo de total de venda. Possiveis valores `WAITING_APPROVED`, `APPROVED`, `CANCELED`, `ALL`
      - name: ids_legado_donos
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
        description: ids legados dos donos
      - name: ids_legado_clientes
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
        description: ids legados dos clientes
      - name: ids_legado_produtos
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
        description: ids legados dos produtos
      - name: ids_legado_categorias
        in: query
        required: false
        schema:
          type: array
          items:
            type: integer
        description: ids legados das categorias
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListagemVendasResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
  /v1/venda:
    post:
      summary: Criar uma nova venda
      operationId: createVenda
      description: Cria uma nova venda no sistema da Conta Azul. Ideal para registrar vendas vindas de sistemas externos diretamente no ERP da Conta Azul.
      tags:
      - v1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriacaoVendaRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CriacaoVendaResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
  /v1/venda/{id}/imprimir:
    get:
      summary: Retornar o PDF de uma venda
      operationId: printVendaPdf
      description: Gera e retorna um PDF da venda identificada pelo ID. Use quando precisar mostrar ao usuário ou armazenar uma versão impressa da venda.
      tags:
      - v1
      parameters:
      - in: path
        name: id
        required: true
        example: 123e4567-e89b-12d3-a456-426614174000
        schema:
          oneOf:
          - type: string
            format: uuid
          - type: integer
        description: id da venda a ser impressa, pode ser passado id ou uuid
      responses:
        '200':
          description: OK
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
  /v1/venda/exclusao-lote:
    post:
      summary: Excluir vendas em lote
      operationId: deleteVendasBatch
      description: Permite excluir várias vendas de uma vez. Útil para excluir em lote vendas de forma automatizada. Útil durante sincronizações ou processos de limpeza de dados.
      tags:
      - v1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExclusaoLote'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExclusaoResponse'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
  /v1/venda/{id_venda}/itens:
    get:
      summary: Retornar os itens de uma venda pelo id da venda
      operationId: getVendaItens
      description: Retorna a lista de itens de uma venda, dado o ID da venda. Use para exibir um detalhe da venda (todos produtos/serviços) ou para sincronizar os itens da venda para outros sistemas.
      tags:
      - v1
      parameters:
      - in: path
        name: id_venda
        required: true
        example: 123e4567-e89b-12d3-a456-426614174000
        schema:
          type: string
          format: uuid
        description: id da venda
      - in: query
        name: pagina
        example: 1
        schema:
          type: integer
          default: 1
        description: Página
      - in: query
        name: tamanho_pagina
        example: 10
        schema:
          enum:
          - 10
          - 20
          - 50
          - 100
          - 200
          - 500
          - 1000
          type: integer
        description: Tamanho da página
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItensPaginados'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
  /v1/venda/proximo-numero:
    get:
      summary: Retornar o próximo número de venda disponível
      operationId: getNextVendaNumber
      description: Retorna o próximo número de venda disponível, segundo a numeração usada no ERP da Conta Azul. Pode ser usado antes de criar uma venda para garantir que você está usando uma sequência de número válida/nova.
      tags:
      - v1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
                nullable: true
                example: 4512645
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '429':
          description: Too Many Requests
        '500':
          description: Internal Server Error
  /v1/contratos/{id}:
    get:
      security:
      - BearerAuth: []
      description: Recupera os detalhes de um contrato específico por ID. Útil quando quiser exibir ou sincronizar todos os dados de um contrato específico.
      tags:
      - v1
      summary: Retornar o contrato por id
      operationId: obterContratoPorID
      parameters:
      - description: ID do contrato (UUID)
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContratoResumo'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroAPI'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroAPI'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroAPI'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroAPI'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroAPI'
    delete:
      security:
      - BearerAuth: []
      description: Remove um contrato existente. O contrato será excluído permanentemente, cancelando todas as vendas associadas (agendadas e efetivadas). Contratos em reajuste de valor não podem ser removidos.
      tags:
      - v1
      summary: Remover um contrato
      operationId: removerContrato
      parameters:
      - description: ID do contrato (UUID)
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroAPI'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroAPI'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroAPI'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroAPI'
  /v1/contratos/{id}/encerrar:
    post:
      security:
      - BearerAuth: []
      description: Encerra um contrato ativo. O contrato será desativado e não poderá mais gerar novas cobranças. Contratos que estão passando por reajuste de valor não podem ser encerrados.
      tags:
      - v1
      summary: Encerrar um contrato
      operationId: encerrarContrato
      parameters:
      - description: ID do contrato (UUID)
        name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroAPI'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroAPI'
        '429':
          description: Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroAPI'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErroAPI'
components:
  schemas:
    CategoriaParcela:
      type: object
      description: Estrutura resumida de categoria enviada em itens de parcela
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único da categoria
          example: b134ec6b-30f8-4edc-9a8f-4787fd3381ac
        nome:
          description: Nome da categoria
          type: string
          example: Adiantamento Salarial
    TipoDePagamento:
      description: Enum de tipo de pagamento
      type: string
      enum:
      - BOLETO_BANCARIO
      - CARTAO_CREDITO
      - CARTAO_DEBITO
      - CARTEIRA_DIGITAL
      - CASHBACK
      - CHEQUE
      - CREDITO_LOJA
      - CREDITO_VIRTUAL
      - DEPOSITO_BANCARIO
      - DINHEIRO
      - OUTRO
      - DEBITO_AUTOMATICO
      - LINK_PAGAMENTO
      - PIX_PAGAMENTO_INSTANTANEO
      - COBRANCA_PIX
      - PROGRAMA_FIDELIDADE
      - SEM_PAGAMENTO
      - TRANSFERENCIA_BANCARIA
      - VALE_ALIMENTACAO
      - VALE_COMBUSTIVEL
      - VALE_PRESENTE
      - VALE_REFEICAO
      x-enum-varnames:
      - PAYMENT_TYPE_BANKING_BILLET
      - PAYMENT_TYPE_CREDIT_CARD
      - PAYMENT_TYPE_DEBIT_CARD
      - PAYMENT_TYPE_DIGITAL_WALLET
      - PAYMENT_TYPE_CASHBACK
      - PAYMENT_TYPE_CHECK
      - PAYMENT_TYPE_STORE_CREDIT
      - PAYMENT_TYPE_VIRTUAL_CREDIT
      - PAYMENT_TYPE_BANKING_DEPOSIT
      - PAYMENT_TYPE_CASH
      - PAYMENT_TYPE_OTHER
      - PAYMENT_TYPE_AUTOMATIC_DEBIT
      - PAYMENT_TYPE_PAYMENT_LINK
      - PAYMENT_TYPE_INSTANT_PAYMENT
      - PAYMENT_TYPE_PIX_CHARGE
      - PAYMENT_TYPE_FIDELITY_PROGRAM
      - PAYMENT_TYPE_WITHOUT_PAYMENT
      - PAYMENT_TYPE_BANKING_TRANSFER
      - PAYMENT_TYPE_FOOD_VOUCHER
      - PAYMENT_TYPE_FUEL_VOUCHER
      - PAYMENT_TYPE_GIFT_VOUCHER
      - PAYMENT_TYPE_MEAL_VOUCHER
    BaixaCriacaoResponseDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 35473eec-4e74-11ee-b500-9f61de8a8b8b
          description: Identificador único gerado automaticamente após a criação
        versao:
          type: integer
          format: int64
          example: 1
          description: Versão da baixa
        data_pagamento:
          type: string
          format: date
          example: '2023-10-01'
          description: Data do pagamento
        composicao_valor:
          $ref: '#/components/schemas/ValorComposicaoDTO'
        conta_financeira:
          type: string
          format: uuid
          example: 35473eec-4e74-11ee-b500-9f61de8a8b8b
          description: Identificador único da conta financeira
        metodo_pagamento:
          type: string
          example: CARTAO_CREDITO
          description: Método de pagamento
          enum:
          - DINHEIRO
          - CARTAO_CREDITO
          - BOLETO_BANCARIO
          - CARTAO_CREDITO_VIA_LINK
          - CHEQUE
          - CARTAO_DEBITO
          - TRANSFERENCIA_BANCARIA
          - OUTRO
          - CARTEIRA_DIGITAL
          - CASHBACK
          - CREDITO_LOJA
          - CREDITO_VIRTUAL
          - DEPOSITO_BANCARIO
          - PIX_PAGAMENTO_INSTANTANEO
        observacao:
          type: string
          example: 'Pagamento referente à fatura #1234.'
          description: Observação
        nsu:
          type: string
          example: '1234567890'
          description: Número sequencial único
    CriacaoVendaRequest:
      type: object
      required:
      - id_cliente
      - numero
      - situacao
      - data_venda
      - itens
      - condicao_pagamento
      properties:
        id_cliente:
          type: string
          format: uuid
          description: id do cliente
          example: 123e4567-e89b-12d3-a456-426614174000
        numero:
          type: integer
          format: int64
          description: Número da venda
          example: 1001
        situacao:
          type: string
          description: Situação da venda
          example: EM_ANDAMENTO
          enum:
          - EM_ANDAMENTO
          - APROVADO
        data_venda:
          type: string
          format: date
          description: Data da venda
          example: '2023-12-31'
        id_categoria:
          type: string
          format: uuid
          description: id da categoria
          example: 123e4567-e89b-12d3-a456-426614174000
        id_centro_custo:
          type: string
          format: uuid
          description: id do centro de custo
          example: 123e4567-e89b-12d3-a456-426614174000
        id_vendedor:
          type: string
          format: uuid
          description: id do vendedor
          example: 40bbdaa5-65c2-49e9-b892-470fd1093ed3
        observacoes:
          type: string
          description: Observações sobre a venda
          example: Observações sobre a venda
        observacoes_pagamento:
          type: string
          description: Observações sobre o pagamento
          example: Observações sobre o pagamento
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemVendaRequest'
        composicao_de_valor:
          $ref: '#/components/schemas/ValorComposicaoRequest'
        condicao_pagamento:
          $ref: '#/components/schemas/CondicaoPagamentoRequest'
    EstoqueCriacaoProduto:
      type: object
      properties:
        valor_venda:
          description: Valor de venda do produto.
          type: number
          format: double
          example: 99.99
        custo_medio:
          description: Valor de custo médio do produto.
          type: number
          format: double
          example: 50
        estoque_disponivel:
          description: Quantidade de estoque disponível do produto.
          type: number
          format: double
          example: 50.5
        estoque_minimo:
          description: Quantidade mínima de estoque do produto.
          type: number
          format: double
          example: 1
        estoque_maximo:
          description: Quantidade máxima de estoque do produto.
          type: number
          format: double
          example: 100
    LocalPrestacaoServicoResumo:
      description: Resumo do local de prestação de serviço do contrato
      type: object
      properties:
        nome:
          description: Nome do local de prestação de serviço
          type: string
          example: Escritório Central
    CondicaoPagamento:
      type: object
      required:
      - dia_vencimento
      - primeira_data_vencimento
      properties:
        tipo_pagamento:
          type: string
          description: Tipo de pagamento
          enum:
          - BOLETO_BANCARIO
          - CARTAO_CREDITO
          - CARTAO_DEBITO
          - CARTEIRA_DIGITAL
          - CASHBACK
          - CHEQUE
          - CREDITO_LOJA
          - CREDITO_VIRTUAL
          - DEPOSITO_BANCARIO
          - DINHEIRO
          - OUTRO
          - DEBITO_AUTOMATICO
          - CARTAO_CREDITO_VIA_LINK
          - PIX_PAGAMENTO_INSTANTANEO
          - PIX_COBRANCA
          - PROGRAMA_FIDELIDADE
          - SEM_PAGAMENTO
          - TRANSFERENCIA_BANCARIA
          - VALE_ALIMENTACAO
          - VALE_COMBUSTIVEL
          - VALE_PRESENTE
          - VALE_REFEICAO
          example: BOLETO_BANCARIO
        id_conta_financeira:
          type: string
          format: uuid
          description: id da conta financeira
          example: 123e4567-e89b-12d3-a456-426614174000
        dia_vencimento:
          type: integer
          description: Dia de vencimento
          example: 10
        primeira_data_vencimento:
          type: string
          format: date
          description: Primeira data de vencimento
          example: '2021-01-10'
    TipoPendenciaResponse:
      type: object
      properties:
        nome:
          type: string
          description: Nome da pendência
