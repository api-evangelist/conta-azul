aid: conta-azul
name: Conta Azul
description: 'Conta Azul is a Brazilian cloud accounting, financial-management and ERP platform for small and medium businesses,
  backed by Ribbit Capital. Its Nova API (v2, api-v2.contaazul.com) exposes the ERP over REST/JSON with OAuth 2.0 (AWS Cognito)
  authorization: financial events (accounts payable and receivable), installments, cost centers, categories and DRE, financial
  accounts and balances, sales, charges, products/inventory, proposals, contracts and settlements (baixas). The legacy API
  was sunset in November 2025 in favor of this versioned, OpenAPI-documented platform.'
